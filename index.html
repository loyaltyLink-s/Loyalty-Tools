<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>beranda</title>
  <style>
    :root {
      --bg: #0c0c0e;
      --surface: #17171b;
      --surface-2: #1e1e24;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f4f4f5;
      --text-dim: #9a9aa2;
      --pink: #fe2c55;
      --cyan: #25f4ee;
      --gradient: linear-gradient(135deg, #25f4ee 0%, #fe2c55 100%);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(circle at 15% 0%, rgba(37, 244, 238, 0.08), transparent 40%),
        radial-gradient(circle at 85% 10%, rgba(254, 44, 85, 0.08), transparent 40%);
      color: var(--text);
      padding-bottom: 48px;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Banner */
    .banner-frame {
      width: 100%;
      max-width: 1080px;
      aspect-ratio: 1080 / 390;
      margin: 20px auto;
      display: block;
      border: none;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    /* Main */
    main {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 28px 24px;
      border-radius: var(--radius);
      margin-bottom: 28px;
      position: relative;
      overflow: hidden;
    }

    main::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--gradient);
    }

    main h1 {
      font-size: 24px;
      margin-bottom: 8px;
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline-block;
    }

    main p {
      color: var(--text-dim);
      font-size: 15px;
    }

    .section-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 14px;
    }

    .category {
      margin-bottom: 28px;
    }

    /* Nav */
    .nav-menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .nav-menu a {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      font-size: 14.5px;
      font-weight: 600;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
      transition: all 0.22s ease;
    }

    .nav-menu .thumb {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface-2);
    }

    .nav-menu .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      aspect-ratio: 1 / 1;
    }

    .nav-menu a:hover {
      border-color: transparent;
      background: var(--surface-2);
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(254, 44, 85, 0.18);
    }

    .nav-menu a:hover .thumb {
      box-shadow: 0 0 0 2px var(--cyan) inset;
    }

    .nav-menu a:active {
      transform: translateY(0);
    }

    footer {
      text-align: center;
      color: var(--text-dim);
      font-size: 12.5px;
      margin-top: 32px;
    }
  </style>
</head>
<body>

  <div class="container">
    <iframe class="banner-frame" src="banner.html" title="Banner" scrolling="no"></iframe>

    <main>
      <h1>Selamat datang</h1>
      <p>Hallo mpruy.</p>
    </main>

    <div class="category">
      <div class="section-label">Stiker & Gambar</div>
      <nav class="nav-menu">
        <a href="fitur/sticker.html">
          <span class="thumb"><img src="assets/thumbnail/sticker.png" alt="Buat Stiker"></span>
          Buat Stiker
        </a>
        <a href="fitur/text-sticker.html">
          <span class="thumb"><img src="assets/thumbnail/text-sticker.png" alt="Meme Teks Stiker"></span>
          Meme Teks Stiker
        </a>
      </nav>
    </div>

    <div class="category">
      <div class="section-label">Download</div>
      <nav class="nav-menu">
        <a href="fitur/tiktokd.html">
          <span class="thumb"><img src="assets/thumbnail/tiktokd.png" alt="TikTok Video Downloader"></span>
          TikTok Video Downloader
        </a>
        <a href="fitur/tiktokaudiod.html">
          <span class="thumb"><img src="assets/thumbnail/tiktokaudiod.png" alt="TikTok Audio Downloader"></span>
          TikTok Audio Downloader
        </a>
      </nav>
    </div>

    <div class="category">
      <div class="section-label">Lainnya</div>
      <nav class="nav-menu">
        <a href="fitur/tiktok-caption-link.html">
          <span class="thumb"><img src="assets/thumbnail/tiktok-caption-link.png" alt="TikTok Caption Link Extractor"></span>
          TikTok Caption Link Extractor
        </a>
      </nav>
    </div>

    <footer>irfan ganteng abis😎</footer>
  </div>

</body>
</html>
