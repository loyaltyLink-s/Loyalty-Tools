<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loyalty Tools</title>
  <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon.png">

  <!-- Open Graph -->
  <meta property="og:title" content="Loyalty Tools">
  <meta property="og:description" content="Kumpulan tools gratis: buat stiker, meme teks stiker, TikTok downloader (video & audio), dan ekstrak link dari caption TikTok.">
  <meta property="og:image" content="https://loyaltylink-s.github.io/Loyalty-Tools/assets/thumbnail/og-preview.png">
  <meta property="og:image:width" content="1080">
  <meta property="og:image:height" content="390">
  <meta property="og:url" content="https://loyaltylink-s.github.io/Loyalty-Tools/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Loyalty Tools">
  <meta name="twitter:description" content="Kumpulan tools gratis: buat stiker, meme teks stiker, TikTok downloader (video & audio), dan ekstrak link dari caption TikTok.">
  <meta name="twitter:image" content="https://loyaltylink-s.github.io/Loyalty-Tools/assets/thumbnail/og-preview.png">
  <style>
    :root {
      --bg: #0c0c0e;
      --surface: #17171b;
      --surface-2: #1e1e24;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f4f4f5;
      --text-dim: #9a9aa2;
      --pink: #fe2c55;
      --cyan: #25f4ee;
      --gradient: linear-gradient(135deg, #25f4ee 0%, #fe2c55 100%);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(circle at 15% 0%, rgba(37, 244, 238, 0.08), transparent 40%),
        radial-gradient(circle at 85% 10%, rgba(254, 44, 85, 0.08), transparent 40%);
      color: var(--text);
      padding-bottom: 48px;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Banner */
    .banner-frame {
      width: 100%;
      max-width: 1080px;
      aspect-ratio: 1080 / 390;
      margin: 20px auto;
      display: block;
      border: none;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    /* Main */
    main {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 28px 24px;
      border-radius: var(--radius);
      margin-bottom: 28px;
      position: relative;
      overflow: hidden;
    }

    main::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--gradient);
    }

    main h1 {
      font-size: 24px;
      margin-bottom: 8px;
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline-block;
    }

    main p {
      color: var(--text-dim);
      font-size: 15px;
    }

    .section-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 14px;
    }

    .category {
      margin-bottom: 28px;
    }

    .feature-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .feature-header .section-label {
      margin-bottom: 0;
      font-size: 15px;
    }

    .view-toggle {
      display: inline-flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      gap: 2px;
    }

    .view-toggle button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 30px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      border-radius: 7px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .view-toggle button svg {
      width: 16px;
      height: 16px;
    }

    .view-toggle button.active {
      background: var(--gradient);
      color: #0c0c0e;
    }

    .view-toggle button:not(.active):hover {
      background: var(--surface-2);
      color: var(--text);
    }

    /* Nav */
    .nav-menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .nav-menu a {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      font-size: 14.5px;
      font-weight: 600;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
      transition: all 0.22s ease;
    }

    .nav-menu .thumb {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface-2);
    }

    .nav-menu .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      aspect-ratio: 1 / 1;
    }

    .nav-menu a:hover {
      border-color: transparent;
      background: var(--surface-2);
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(254, 44, 85, 0.18);
    }

    .nav-menu a:hover .thumb {
      box-shadow: 0 0 0 2px var(--cyan) inset;
    }

    .nav-menu a:active {
      transform: translateY(0);
    }

    /* Tampilan Petak (grid) */
    .nav-menu.petak {
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    }

    .nav-menu.petak a {
      flex-direction: column;
      justify-content: center;
      text-align: center;
      gap: 10px;
      padding: 16px 10px;
    }

    .nav-menu.petak .thumb {
      width: 64px;
      height: 64px;
    }

    .nav-menu.petak a span:not(.thumb) {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .nav-menu.petak a {
      font-size: 12.5px;
      line-height: 1.3;
    }

    footer {
      text-align: center;
      color: var(--text-dim);
      font-size: 12.5px;
      margin-top: 32px;
    }

    /* Popup */
    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
    }

    .popup-content {
      position: relative;
      max-width: min(90vw, 600px);
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .popup-image {
      width: auto;
      height: auto;
      max-width: 90vw;
      max-height: 82vh;
      aspect-ratio: 4 / 5;
      object-fit: contain;
      display: block;
      border-radius: var(--radius);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    }

    .popup-close {
      position: absolute;
      top: -12px;
      right: -12px;
      width: 38px;
      height: 38px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      background: var(--surface-2);
      color: var(--text);
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .popup-close:hover {
      background: #2a2a31;
    }

    .popup-option {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-dim);
      font-size: 13px;
      user-select: none;
    }

    .popup-option input {
      width: 16px;
      height: 16px;
      accent-color: var(--pink);
      cursor: pointer;
    }

    .popup-option label {
      cursor: pointer;
    }

    .popup-overlay.hidden {
      display: none;
    }

  </style>
</head>
<body>


  <!-- Popup -->
  <div class="popup-overlay" id="popupOverlay">
    <div class="popup-content">
      <button class="popup-close" id="popupClose" type="button" aria-label="Tutup">&times;</button>

      <img
        class="popup-image"
        src="assets/popup.png"
        alt="Popup"
      >

      <div class="popup-option">
        <input type="checkbox" id="dontShowAgain">
        <label for="dontShowAgain">Jangan tampilkan ini lagi</label>
      </div>
    </div>
  </div>

  <div class="container">
    <iframe class="banner-frame" src="banner.html" title="Banner" scrolling="no"></iframe>

    <main>
      <h1>Selamat datang</h1>
      <p>Hallo mpruy.</p>
    </main>

    <div class="feature-header">
      <div class="section-label" style="margin-bottom:0;">Pilih Fitur</div>
      <div class="view-toggle" id="viewToggle">
        <button type="button" id="btnList" title="Tampilan List" aria-label="Tampilan List">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
        </button>
        <button type="button" id="btnPetak" title="Tampilan Petak" aria-label="Tampilan Petak">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        </button>
      </div>
    </div>

    <div class="category">
      <div class="section-label">Stiker & Gambar</div>
      <nav class="nav-menu">
        <a href="fitur/sticker.html">
          <span class="thumb"><img src="assets/thumbnail/sticker.png" alt="Buat Stiker"></span>
          <span>Buat Stiker</span>
        </a>
        <a href="fitur/text-sticker.html">
          <span class="thumb"><img src="assets/thumbnail/text-sticker.png" alt="Meme Teks Stiker"></span>
          <span>Meme Teks Stiker</span>
        </a>
      </nav>
    </div>

    <div class="category">
      <div class="section-label">Download</div>
      <nav class="nav-menu">
        <a href="fitur/tiktokd.html">
          <span class="thumb"><img src="assets/thumbnail/tiktokd.png" alt="TikTok Video Downloader"></span>
          <span>TikTok Video Downloader</span>
        </a>
        <a href="fitur/tiktokaudiod.html">
          <span class="thumb"><img src="assets/thumbnail/tiktokaudiod.png" alt="TikTok Audio Downloader"></span>
          <span>TikTok Audio Downloader</span>
        </a>
      </nav>
    </div>

    <div class="category">
      <div class="section-label">Lainnya</div>
      <nav class="nav-menu">
        <a href="fitur/tiktok-caption-link.html">
          <span class="thumb"><img src="assets/thumbnail/tiktok-caption-link.png" alt="TikTok Caption Link Extractor"></span>
          <span>TikTok Caption Link Extractor</span>
        </a>
      </nav>
    </div>

    <footer>irfan keren abis😎✌️</footer>
  </div>

  <script>
    const viewToggle = document.getElementById('viewToggle');
    const btnList = document.getElementById('btnList');
    const btnPetak = document.getElementById('btnPetak');
    const navMenus = document.querySelectorAll('.nav-menu');
    const STORAGE_KEY = 'fiturViewMode';

    function applyView(mode) {
      navMenus.forEach(nav => nav.classList.toggle('petak', mode === 'petak'));
      btnList.classList.toggle('active', mode !== 'petak');
      btnPetak.classList.toggle('active', mode === 'petak');
    }

    btnList.addEventListener('click', () => {
      applyView('list');
      localStorage.setItem(STORAGE_KEY, 'list');
    });

    btnPetak.addEventListener('click', () => {
      applyView('petak');
      localStorage.setItem(STORAGE_KEY, 'petak');
    });

    // Terapkan mode tersimpan (default: list)
    applyView(localStorage.getItem(STORAGE_KEY) || 'list');

    // Popup
    const popupOverlay = document.getElementById('popupOverlay');
    const popupClose = document.getElementById('popupClose');
    const dontShowAgain = document.getElementById('dontShowAgain');
    const POPUP_STORAGE_KEY = 'loyaltyToolsPopupHidden';

    function closePopup() {
      if (dontShowAgain.checked) {
        localStorage.setItem(POPUP_STORAGE_KEY, 'true');
      }

      popupOverlay.classList.add('hidden');
    }

    popupClose.addEventListener('click', closePopup);

    popupOverlay.addEventListener('click', (event) => {
      if (event.target === popupOverlay) {
        closePopup();
      }
    });

    if (localStorage.getItem(POPUP_STORAGE_KEY) === 'true') {
      popupOverlay.classList.add('hidden');
    }

  </script>

</body>
</html>
