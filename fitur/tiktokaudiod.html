<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Audio Extractor (MP3)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0c0c0e;
            background-image:
                radial-gradient(circle at 10% 0%, rgba(37, 244, 238, 0.08), transparent 40%),
                radial-gradient(circle at 90% 10%, rgba(254, 44, 85, 0.08), transparent 40%);
        }
        .brand-gradient-text {
            background: linear-gradient(135deg, #25f4ee 0%, #fe2c55 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .brand-gradient-bg {
            background: linear-gradient(135deg, #25f4ee 0%, #fe2c55 100%);
        }
        .brand-gradient-bg:hover { opacity: 0.9; }
        .brand-ring { border-color: #fe2c55; }
    </style>
</head>
<body class="text-white flex justify-center items-center min-h-screen p-4">

    <div class="bg-[#17171b] p-8 rounded-2xl shadow-2xl w-full max-w-md border border-white/10">
        
        <!-- Tombol Kembali -->
        <a href="../index.html" class="fixed top-4 left-4 z-50 inline-flex items-center gap-1.5 bg-[#17171b] border border-white/10 text-gray-300 hover:text-white hover:border-[#fe2c55] text-sm font-semibold px-4 py-2 rounded-full transition duration-150">
            &larr; Kembali
        </a>

        <h1 class="text-2xl font-bold mb-2 text-center brand-gradient-text">TikTok Audio Extractor</h1>
        <p class="text-gray-400 text-sm mb-6 text-center">Ekstrak & Unduh Audio (MP3) dari TikTok</p>

        <!-- Form Input -->
        <form id="downloadForm" class="space-y-4">
            <div>
                <label for="tiktokUrl" class="block text-sm font-medium text-gray-300 mb-1">Link Video TikTok</label>
                <input type="url" id="tiktokUrl" required placeholder="https://vt.tiktok.com/..." 
                    class="w-full px-4 py-2 bg-[#0c0c0e] border border-white/10 rounded-lg focus:ring-2 focus:ring-[#fe2c55] focus:outline-none text-sm text-white">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full brand-gradient-bg text-[#0c0c0e] font-bold py-2 rounded-lg transition duration-200 text-sm">
                Ekstrak Audio
            </button>
        </form>

        <!-- Result Area -->
        <div id="resultArea" class="mt-6 hidden">
            <div class="p-4 bg-[#0c0c0e] border border-white/10 rounded-lg text-center space-y-4">
                <p id="statusText" class="text-sm text-gray-300">Memproses link...</p>
                
                <!-- Audio Metadata & Player -->
                <div id="audioMeta" class="hidden space-y-3">
                    <img id="musicCover" src="" alt="Album Cover" class="w-20 h-20 object-cover mx-auto rounded-full shadow-lg border-2 border-[#fe2c55]">
                    <div>
                        <p id="musicTitle" class="text-sm font-bold text-white line-clamp-1"></p>
                        <p id="musicAuthor" class="text-xs text-gray-400 line-clamp-1"></p>
                    </div>

                    <!-- Audio Player Preview -->
                    <audio id="audioPlayer" controls class="w-full h-8 mt-2"></audio>
                </div>

                <div id="downloadAction"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('downloadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const urlInput = document.getElementById('tiktokUrl').value.trim();
            const resultArea = document.getElementById('resultArea');
            const statusText = document.getElementById('statusText');
            const downloadAction = document.getElementById('downloadAction');
            const audioMeta = document.getElementById('audioMeta');
            const musicCover = document.getElementById('musicCover');
            const musicTitle = document.getElementById('musicTitle');
            const musicAuthor = document.getElementById('musicAuthor');
            const audioPlayer = document.getElementById('audioPlayer');
            const submitBtn = document.getElementById('submitBtn');

            // Reset & Loading state
            resultArea.classList.remove('hidden');
            audioMeta.classList.add('hidden');
            statusText.textContent = "Mengambil data audio...";
            statusText.className = "text-sm text-gray-300";
            downloadAction.innerHTML = '';
            submitBtn.disabled = true;

            try {
                // Memanggil API TikWM
                const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}`);
                const result = await response.json();

                if (result.code === 0 && result.data.music) {
                    const musicData = result.data.music_info || {};
                    const audioUrl = result.data.music;

                    // Tampilkan Info Musik
                    musicCover.src = musicData.cover || result.data.cover;
                    musicTitle.textContent = musicData.title || "Audio TikTok";
                    musicAuthor.textContent = musicData.author || "Unknown Artist";
                    audioPlayer.src = audioUrl;
                    
                    audioMeta.classList.remove('hidden');
                    statusText.textContent = "Audio berhasil diekstrak!";

                    // Tombol Unduh
                    downloadAction.innerHTML = `
                        <a href="${audioUrl}" target="_blank" download="tiktok-audio.mp3" 
                           class="inline-block bg-green-600 hover:bg-green-700 text-white text-xs font-semibold px-4 py-2 rounded transition w-full">
                            Unduh MP3 / Audio
                        </a>
                    `;
                } else {
                    statusText.textContent = "Gagal mengambil audio. Pastikan URL valid dan publik.";
                    statusText.className = "text-sm text-red-400";
                }
            } catch (error) {
                statusText.textContent = "Terjadi kesalahan koneksi API.";
                statusText.className = "text-sm text-red-400";
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
