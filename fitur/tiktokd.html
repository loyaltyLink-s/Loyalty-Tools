<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Video Downloader - Loyalty Tools</title>

    <!-- Open Graph -->
    <meta property="og:title" content="TikTok Video Downloader - Loyalty Tools">
    <meta property="og:description" content="Download video TikTok tanpa watermark, gratis dan cepat.">
    <meta property="og:image" content="https://loyaltylink-s.github.io/Loyalty-Tools/assets/thumbnail/tiktokd.png">
    <meta property="og:url" content="https://loyaltylink-s.github.io/Loyalty-Tools/fitur/tiktokd.html">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="TikTok Video Downloader - Loyalty Tools">
    <meta name="twitter:image" content="https://loyaltylink-s.github.io/Loyalty-Tools/assets/thumbnail/tiktokd.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0c0c0e;
            background-image:
                radial-gradient(circle at 10% 0%, rgba(37, 244, 238, 0.08), transparent 40%),
                radial-gradient(circle at 90% 10%, rgba(254, 44, 85, 0.08), transparent 40%);
        }
        .brand-gradient-text {
            background: linear-gradient(135deg, #25f4ee 0%, #fe2c55 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .brand-gradient-bg {
            background: linear-gradient(135deg, #25f4ee 0%, #fe2c55 100%);
        }
        .brand-gradient-bg:hover { opacity: 0.9; }
    </style>
</head>
<body class="text-white flex justify-center items-center min-h-screen p-4">

    <div class="bg-[#17171b] p-8 rounded-2xl shadow-2xl w-full max-w-md border border-white/10">
        
        <!-- Tombol Kembali -->
        <a href="../index.html" class="fixed top-4 left-4 z-50 inline-flex items-center gap-1.5 bg-[#17171b] border border-white/10 text-gray-300 hover:text-white hover:border-[#25f4ee] text-sm font-semibold px-4 py-2 rounded-full transition duration-150">
            &larr; Kembali
        </a>

        <h1 class="text-2xl font-bold mb-2 text-center brand-gradient-text">TikTok Downloader</h1>
        <p class="text-gray-400 text-sm mb-6 text-center">Download videos without watermark</p>

        <!-- Form -->
        <form id="downloadForm" class="space-y-4">
            <div>
                <label for="tiktokUrl" class="block text-sm font-medium text-gray-300 mb-1">TikTok Video Link</label>
                <input type="url" id="tiktokUrl" required placeholder="https://vt.tiktok.com/..." 
                    class="w-full px-4 py-2 bg-[#0c0c0e] border border-white/10 rounded-lg focus:ring-2 focus:ring-[#25f4ee] focus:outline-none text-sm text-white">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full brand-gradient-bg text-[#0c0c0e] font-bold py-2 rounded-lg transition duration-200 text-sm">
                Get Video
            </button>
        </form>

        <!-- Result Area -->
        <div id="resultArea" class="mt-6 hidden">
            <div class="p-4 bg-[#0c0c0e] border border-white/10 rounded-lg text-center space-y-3">
                <p id="statusText" class="text-sm text-gray-300">Processing your link...</p>
                <div id="videoMeta" class="hidden">
                    <img id="videoCover" src="" alt="Thumbnail" class="w-24 h-24 object-cover mx-auto rounded-md mb-2">
                    <p id="videoTitle" class="text-xs text-gray-400 line-clamp-2"></p>
                </div>
                <div id="downloadAction"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('downloadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const urlInput = document.getElementById('tiktokUrl').value.trim();
            const resultArea = document.getElementById('resultArea');
            const statusText = document.getElementById('statusText');
            const downloadAction = document.getElementById('downloadAction');
            const videoMeta = document.getElementById('videoMeta');
            const videoCover = document.getElementById('videoCover');
            const videoTitle = document.getElementById('videoTitle');
            const submitBtn = document.getElementById('submitBtn');

            // Reset dan tampilkan state loading
            resultArea.classList.remove('hidden');
            videoMeta.classList.add('hidden');
            statusText.textContent = "Mengambil data video...";
            statusText.className = "text-sm text-gray-300";
            downloadAction.innerHTML = '';
            submitBtn.disabled = true;

            try {
                // Memanggil API publik TikWM
                const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}`);
                const result = await response.json();

                if (result.code === 0) {
                    const videoData = result.data;

                    // Tampilkan metadata video
                    videoCover.src = videoData.cover;
                    videoTitle.textContent = videoData.title || "Video TikTok";
                    videoMeta.classList.remove('hidden');
                    
                    statusText.textContent = "Video siap diunduh!";

                    // Buat tombol unduh tanpa watermark
                    downloadAction.innerHTML = `
                        <a href="${videoData.play}" target="_blank" download="tiktok-no-watermark.mp4" 
                           class="inline-block bg-green-600 hover:bg-green-700 text-white text-xs font-semibold px-4 py-2 rounded transition w-full">
                            Download MP4 (Tanpa Watermark)
                        </a>
                    `;
                } else {
                    statusText.textContent = "Gagal mengambil video. Pastikan URL benar/publik.";
                    statusText.className = "text-sm text-red-400";
                }
            } catch (error) {
                statusText.textContent = "Terjadi kesalahan koneksi API.";
                statusText.className = "text-sm text-red-400";
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
