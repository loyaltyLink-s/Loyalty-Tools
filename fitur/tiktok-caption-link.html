<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Caption Link Extractor</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0c0c0e;
            background-image:
                radial-gradient(circle at 10% 0%, rgba(37, 244, 238, 0.08), transparent 40%),
                radial-gradient(circle at 90% 10%, rgba(254, 44, 85, 0.08), transparent 40%);
        }
        .brand-gradient-text {
            background: linear-gradient(135deg, #25f4ee 0%, #fe2c55 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .brand-gradient-bg {
            background: linear-gradient(135deg, #25f4ee 0%, #fe2c55 100%);
        }
        .brand-gradient-bg:hover { opacity: 0.9; }
    </style>
</head>
<body class="text-white flex justify-center items-center min-h-screen p-4">

    <div class="bg-[#17171b] p-8 rounded-2xl shadow-2xl w-full max-w-md border border-white/10">
        
        <!-- Tombol Kembali -->
        <a href="../index.html" class="fixed top-4 left-4 z-50 inline-flex items-center gap-1.5 bg-[#17171b] border border-white/10 text-gray-300 hover:text-white hover:border-[#25f4ee] text-sm font-semibold px-4 py-2 rounded-full transition duration-150">
            &larr; Kembali
        </a>

        <h1 class="text-2xl font-bold mb-2 text-center brand-gradient-text">TikTok Link Extractor</h1>
        <p class="text-gray-400 text-sm mb-6 text-center">Cari dan ekstrak link dari caption video TikTok</p>

        <!-- Form Input -->
        <form id="extractForm" class="space-y-4">
            <div>
                <label for="tiktokUrl" class="block text-sm font-medium text-gray-300 mb-1">Tautan Video TikTok</label>
                <input type="url" id="tiktokUrl" required placeholder="https://vt.tiktok.com/..." 
                    class="w-full px-4 py-2 bg-[#0c0c0e] border border-white/10 rounded-lg focus:ring-2 focus:ring-[#25f4ee] focus:outline-none text-sm text-white">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full brand-gradient-bg text-[#0c0c0e] font-bold py-2 rounded-lg transition duration-200 text-sm">
                Cari Link
            </button>
        </form>

        <!-- Result Area -->
        <div id="resultArea" class="mt-6 hidden">
            <div class="p-4 bg-[#0c0c0e] border border-white/10 rounded-lg space-y-4">
                <p id="statusText" class="text-sm text-gray-300 text-center">Memproses tautan...</p>
                
                <!-- Info Video -->
                <div id="videoMeta" class="hidden flex items-start space-x-3 bg-[#17171b] p-3 rounded-md border border-white/10">
                    <img id="videoCover" src="" alt="Thumbnail" class="w-16 h-16 object-cover rounded-md flex-shrink-0">
                    <div class="overflow-hidden">
                        <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block">Caption Video</span>
                        <p id="videoTitle" class="text-xs text-gray-300 line-clamp-3 leading-relaxed whitespace-pre-wrap"></p>
                    </div>
                </div>

                <!-- Hasil Ekstraksi Link -->
                <div id="linkResult" class="hidden space-y-2">
                    <span class="text-xs font-bold text-[#25f4ee] block">Link Ditemukan:</span>
                    <div id="linkContainer" class="space-y-2"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('extractForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const urlInput = document.getElementById('tiktokUrl').value.trim();
            const resultArea = document.getElementById('resultArea');
            const statusText = document.getElementById('statusText');
            const videoMeta = document.getElementById('videoMeta');
            const videoCover = document.getElementById('videoCover');
            const videoTitle = document.getElementById('videoTitle');
            const linkResult = document.getElementById('linkResult');
            const linkContainer = document.getElementById('linkContainer');
            const submitBtn = document.getElementById('submitBtn');

            // Reset UI
            resultArea.classList.remove('hidden');
            videoMeta.classList.add('hidden');
            linkResult.classList.add('hidden');
            linkContainer.innerHTML = '';
            statusText.textContent = "Mengambil caption video...";
            statusText.className = "text-sm text-gray-300 text-center";
            submitBtn.disabled = true;

            try {
                // Memanggil API TikWM
                const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}`);
                const result = await response.json();

                if (result.code === 0) {
                    const videoData = result.data;
                    const caption = videoData.title || "";

                    // Tampilkan metadata video & caption
                    videoCover.src = videoData.cover;
                    videoTitle.textContent = caption || "(Tidak ada caption)";
                    videoMeta.classList.remove('hidden');

                    // RegEx pencarian URL
                    const urlPattern = /(https?:\/\/[^\s]+)/g;
                    const matches = caption.match(urlPattern);

                    if (matches && matches.length > 0) {
                        statusText.textContent = "Berhasil menemukan link!";
                        statusText.className = "text-sm text-green-400 font-semibold text-center";

                        matches.forEach(url => {
                            const cleanUrl = url.replace(/[.,;!?]+$/, '');

                            // Wrapper tiap elemen link + tombol salin
                            const itemWrapper = document.createElement('div');
                            itemWrapper.className = "flex items-center space-x-2 bg-[#17171b] p-2 rounded-lg border border-white/10";

                            // Tag <a> untuk buka link langsung
                            const linkItem = document.createElement('a');
                            linkItem.href = cleanUrl;
                            linkItem.target = "_blank";
                            linkItem.rel = "noopener noreferrer";
                            linkItem.className = "text-[#25f4ee] hover:text-white text-xs font-medium break-all flex-1 transition";
                            linkItem.textContent = cleanUrl;

                            // Tombol Salin
                            const copyBtn = document.createElement('button');
                            copyBtn.type = "button";
                            copyBtn.className = "bg-[#1e1e24] hover:bg-[#26262d] text-gray-200 text-[11px] font-semibold px-2.5 py-1.5 rounded transition flex-shrink-0";
                            copyBtn.textContent = "Salin";

                            // Fungsi Klik Salin
                            copyBtn.onclick = () => {
                                navigator.clipboard.writeText(cleanUrl).then(() => {
                                    copyBtn.textContent = "Tersalin!";
                                    copyBtn.className = "bg-green-600 text-white text-[11px] font-semibold px-2.5 py-1.5 rounded transition flex-shrink-0";
                                    setTimeout(() => {
                                        copyBtn.textContent = "Salin";
                                        copyBtn.className = "bg-[#1e1e24] hover:bg-[#26262d] text-gray-200 text-[11px] font-semibold px-2.5 py-1.5 rounded transition flex-shrink-0";
                                    }, 2000);
                                });
                            };

                            itemWrapper.appendChild(linkItem);
                            itemWrapper.appendChild(copyBtn);
                            linkContainer.appendChild(itemWrapper);
                        });

                        linkResult.classList.remove('hidden');
                    } else {
                        statusText.textContent = "Caption terdeteksi, tetapi tidak ada link di dalamnya.";
                        statusText.className = "text-sm text-yellow-400 text-center";
                    }
                } else {
                    statusText.textContent = "Gagal mengambil data. Pastikan URL video publik & benar.";
                    statusText.className = "text-sm text-red-400 text-center";
                }
            } catch (error) {
                statusText.textContent = "Terjadi kesalahan koneksi API.";
                statusText.className = "text-sm text-red-400 text-center";
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
