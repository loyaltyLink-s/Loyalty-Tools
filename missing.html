<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitur Tidak Ditemukan - Loyalty Tools</title>

  <style>
    :root {
      --bg: #0c0c0e;
      --surface: #17171b;
      --surface-2: #1e1e24;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f4f4f5;
      --text-dim: #9a9aa2;
      --pink: #fe2c55;
      --cyan: #25f4ee;
      --gradient: linear-gradient(135deg, #25f4ee 0%, #fe2c55 100%);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(circle at 15% 0%, rgba(37, 244, 238, 0.08), transparent 40%),
        radial-gradient(circle at 85% 10%, rgba(254, 44, 85, 0.08), transparent 40%);
      color: var(--text);
    }

    .container {
      width: 100%;
      max-width: 560px;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 42px 28px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }

    .container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--gradient);
    }

    .icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 38px;
    }

    h1 {
      font-size: 27px;
      margin-bottom: 10px;
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      color: var(--text-dim);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 26px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 150px;
      padding: 12px 20px;
      border-radius: 12px;
      background: var(--gradient);
      color: #0c0c0e;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(254, 44, 85, 0.2);
    }

    .button:active {
      transform: translateY(0);
    }

    .footer {
      margin-top: 22px;
      color: var(--text-dim);
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="icon">🔧</div>

    <h1>Fitur Tidak Ditemukan</h1>

    <p>
      Waduh, fitur yang kamu coba buka sepertinya belum tersedia,
      sudah dipindahkan, atau sedang tidak dapat diakses.
    </p>

    <a class="button" href="index.html">← Kembali ke Beranda</a>

    <div class="footer">
      Loyalty Tools · irfan keren abis😎✌️
    </div>
  </main>
</body>
</html>
